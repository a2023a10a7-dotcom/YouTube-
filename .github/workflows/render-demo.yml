name: Documentary production pipeline
on:
  workflow_dispatch:
    inputs:
      reference_urls:
        description: "Paste 3 or 5 YouTube reference links, one per line (optional)"
        required: false
        type: string
      production_script:
        description: "Documentary topic. Production mode researches, scripts, selects clips, narrates and renders. Requires OPENAI_API_KEY and PEXELS_API_KEY secrets."
        required: false
        type: string
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"
      - ".github/workflows/render-demo.yml"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Save supplied YouTube reference links
        if: ${{ inputs.reference_urls != '' }}
        env:
          YOUTUBE_REFERENCE_URLS: ${{ inputs.reference_urls }}
        run: |
          node --input-type=module -e '
            import { saveReferenceProfile } from "./src/reference-videos.mjs";
            const urls = (process.env.YOUTUBE_REFERENCE_URLS || "").split(/\s+/).filter(Boolean);
            const profile = await saveReferenceProfile(urls);
            console.log(`Saved ${profile.referenceCount} reference URLs. Visual style is not yet analyzed.`);
          '
      - name: Analyze reference thumbnails with AI (limited evidence)
        if: ${{ inputs.reference_urls != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node src/reference-style-analysis.mjs data/channel-profile.json
      - name: Generate AI-directed scenes, stock footage, and voice narration
        if: ${{ inputs.production_script != '' }}
        env:
          SCRIPT_TEXT: ${{ inputs.production_script }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$PEXELS_API_KEY" ]; then
            echo "::error::Production mode requires OPENAI_API_KEY and PEXELS_API_KEY in repository Actions secrets."
            exit 1
          fi
          node --input-type=module -e 'import {writeFile} from "node:fs/promises"; await writeFile("production-topic.txt", process.env.SCRIPT_TEXT);'
          node src/production-agent.mjs production-topic.txt
          npm run render:project
      - name: Verify production render and project asset provenance
        if: ${{ inputs.production_script != '' }}
        run: npm run qa:render
      - name: Render the technical demo when no script was supplied
        if: ${{ inputs.production_script == '' }}
        run: npm run render:demo
      - name: Upload reference profile
        if: hashFiles('data/channel-profile.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-reference-profile
          path: data/
      - name: Upload generated documentary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.production_script != '' && 'generated-documentary' || 'documentary-demo-mp4' }}
          path: ${{ inputs.production_script != '' && 'out/documentary.mp4' || 'out/demo.mp4' }}
          if-no-files-found: error
      - name: Upload project files and asset provenance
        if: ${{ inputs.production_script != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: documentary-project-source
          path: |
            public/project/
            public/assets/
