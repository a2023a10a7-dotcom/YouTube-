name: Documentary production pipeline

on:
  workflow_dispatch:
    inputs:
      telegram_zip_file_id:
        description: "Telegram file_id for the documentary ZIP package."
        required: false
        type: string
      telegram_zip_name:
        description: "Original ZIP filename."
        required: false
        type: string
      telegram_chat_id:
        description: "Private Telegram chat ID supplied by the inbox bridge."
        required: false
        type: string
      production_script:
        description: "Legacy topic input (not used by the ZIP production route)."
        required: false
        type: string
      reference_urls:
        description: "Optional reference URLs (not used by the ZIP production route)."
        required: false
        type: string
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - "workers/telegram/src/**"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"
      - ".gitmodules"
      - ".github/workflows/render-demo.yml"

permissions:
  contents: read
  actions: read

jobs:
  render-zip:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.telegram_zip_file_id != '') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || (github.event_name == 'push' && '8253589285') || '' }}
    steps:
      - name: Checkout repository and OpenMontage
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install open-source production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts requests pyyaml pydantic jsonschema python-dotenv pillow numpy certifi yt-dlp
          python -m py_compile scripts/openmontage_asset_search.py

      - name: Install Node dependencies and run tests
        run: |
          npm install
          npm test

      - name: Download local English Piper voice
        run: |
          mkdir -p voices incoming extracted
          curl -fL --retry 5 --retry-delay 2 "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx" -o voices/en_US-lessac-medium.onnx
          curl -fL --retry 5 --retry-delay 2 "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json" -o voices/en_US-lessac-medium.onnx.json
          test -s voices/en_US-lessac-medium.onnx
          test -s voices/en_US-lessac-medium.onnx.json
          piper --help >/dev/null

      - name: Download ZIP from Telegram
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_zip_file_id }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_FILE_ID"
          FILE_PATH=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getFile?file_id=${TELEGRAM_FILE_ID}" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["file_path"])')
          curl -fLsS "https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}/${FILE_PATH}" -o incoming/package.zip
          test -s incoming/package.zip

      - name: Download the already validated ZIP artifact for the first end-to-end run
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[render-existing-artifact]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15232315987/zip" -o incoming/package.zip
          test -s incoming/package.zip

      - name: Safely extract and validate the documentary package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          archive = Path("incoming/package.zip")
          if archive.stat().st_size > 20 * 1024 * 1024:
              raise SystemExit("ZIP exceeds 20 MiB.")
          required = {
              "project_brief.md", "research_analysis.md", "documentary_screenplay.md",
              "director_blueprint.md", "director_blueprint.json", "asset_manifest.json"
          }
          out = Path("extracted").resolve()
          with ZipFile(archive) as z:
              infos = z.infolist()
              if len(infos) > 300:
                  raise SystemExit("ZIP contains too many entries (limit 300).")
              found = {}
              total = 0
              for info in infos:
                  name = info.filename.replace("\\", "/")
                  if name.startswith("/") or ".." in Path(name).parts:
                      if info.is_dir():
                          continue
                      raise SystemExit("Unsafe ZIP path rejected: " + name)
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit("ZIP symlink rejected: " + name)
                  total += info.file_size
                  if total > 100 * 1024 * 1024:
                      raise SystemExit("Expanded ZIP exceeds 100 MiB.")
                  if Path(name).name in required:
                      found[Path(name).name] = info
              missing = sorted(required - found.keys())
              if missing:
                  raise SystemExit("ZIP missing required files: " + ", ".join(missing))
              for name, info in found.items():
                  with z.open(info) as src, (out / name).open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          for name in ("director_blueprint.json", "asset_manifest.json"):
              with (out / name).open(encoding="utf-8") as f:
                  json.load(f)
          print("ZIP_VALIDATION_OK")
          print("Extracted: " + ", ".join(sorted(required)))
          PY

      - name: Build scene assets, narration, music and Remotion props
        run: node scripts/prepare-zip-documentary.mjs

      - name: Render the actual documentary with Remotion
        run: |
          npx remotion render src/index.ts Documentary out/documentary.mp4 --props=public/project/props.json --codec=h264 --crf=22 --pixel-format=yuv420p --concurrency=2

      - name: Verify the rendered documentary and all project assets
        run: npm run qa:render

      - name: Create Telegram-compatible 1080p delivery copy
        run: |
          set -euo pipefail
          ffmpeg -y -i out/documentary.mp4 -c:v libx264 -preset medium -b:v 1700k -maxrate 1700k -bufsize 3400k -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart out/documentary-telegram.mp4
          SIZE=$(stat -c%s out/documentary-telegram.mp4)
          if [ "$SIZE" -gt 48000000 ]; then
            ffmpeg -y -i out/documentary-telegram.mp4 -c:v libx264 -preset slow -b:v 1350k -maxrate 1350k -bufsize 2700k -pix_fmt yuv420p -c:a aac -b:a 80k -movflags +faststart out/documentary-telegram-small.mp4
            mv out/documentary-telegram-small.mp4 out/documentary-telegram.mp4
            SIZE=$(stat -c%s out/documentary-telegram.mp4)
          fi
          test "$SIZE" -lt 49000000
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration -of json out/documentary-telegram.mp4

      - name: Upload final documentary and production project
        uses: actions/upload-artifact@v4
        with:
          name: michkatt-final-documentary
          path: |
            out/documentary.mp4
            out/documentary-telegram.mp4
            public/project/
            public/assets/
          if-no-files-found: error
          retention-days: 14

      - name: Deliver the finished MP4 to Telegram
        if: ${{ env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -s out/documentary-telegram.mp4
          RESPONSE=$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" -F "chat_id=$TELEGRAM_CHAT_ID" -F "document=@out/documentary-telegram.mp4;type=video/mp4" -F "caption=🎬 تم إنتاج الوثائقي وفحص ملف الفيديو بنجاح عبر OpenMontage وRemotion، مع تعليق صوتي Piper وموسيقى أصلية. لم يتم استخدام OpenAI API.")
          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok"), d; print("Telegram accepted: "+d["result"]["document"]["file_name"])'

      - name: Notify Telegram if production fails
        if: ${{ failure() && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=تعثر إنتاج الوثائقي في مرحلة من مراحل OpenMontage أو Remotion. لم أرسل فيديو غير مكتمل؛ راجع سجل GitHub Actions."

  demo:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_zip_file_id == '' && inputs.production_script == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run render:demo
      - uses: actions/upload-artifact@v4
        with:
          name: documentary-demo-mp4
          path: out/demo.mp4
          if-no-files-found: error
