name: Telegram webhook worker checks and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/telegram/**"
      - ".github/workflows/telegram-worker-check.yml"
  pull_request:
    paths:
      - "workers/telegram/**"
      - ".github/workflows/telegram-worker-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/telegram/package.json
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check src/index.js
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy Worker to Cloudflare
        if: ${{ github.event_name == 'push' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deployment."
            exit 0
          fi
          npx wrangler deploy
